<app-spinner-overlay [displayProgressSpinner]="(loading$ | async) ?? false" />

<app-spinner-overlay [displayProgressSpinner]="(loading$ | async) ?? false" />

<div class="bg-white rounded-[30px] shadow-soft overflow-hidden mt-8 border border-gray-100">
  <div class="p-6 md:p-8">
    <app-customer-filters-section (onSortChange)="updateSort($event)" (onFilterTagsChange)="updateTags($event)" />

    <div class="overflow-x-auto mt-8">
      <table class="min-w-full w-full">
        <thead>
          <tr class="border-b border-gray-100">
            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Customer Name</th>
            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider hidden md:table-cell">Company</th>
            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider hidden lg:table-cell">Phone Number</th>
            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider hidden lg:table-cell">Email</th>
            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider hidden md:table-cell">Country</th>
            <th class="px-6 py-4 text-center text-xs font-semibold text-gray-400 uppercase tracking-wider hidden md:table-cell">Status</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
          @for (customer of customers; track customer.email) {
          <tr class="hover:bg-gray-50/80 transition-colors duration-200 group">
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="text-sm font-semibold text-gray-900 group-hover:text-primary transition-colors">{{ customer.customerName }}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap hidden md:table-cell">
              <span class="text-sm text-gray-600">{{ customer.company }}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap hidden lg:table-cell">
              <span class="text-sm text-gray-600">{{ customer.phone }}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap hidden lg:table-cell">
              <span class="text-sm text-gray-600">{{ customer.email }}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap hidden md:table-cell">
              <span class="text-sm font-medium text-gray-900">{{ customer.country }}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap hidden md:table-cell text-center">
              <app-customer-status [customerStatus]="customer.status" />
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="mt-6">
      <app-table-pagination (onPageChange)="updatePagination($event)" />
    </div>
  </div>
</div>
